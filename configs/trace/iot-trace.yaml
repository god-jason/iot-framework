--- !<tag:barectf.org,2020/3/config>
# iot-frame RTOS CTF tracing configuration (barectf 3.x)
#
# Regenerate with: python configs/trace/gen.py
# All event records share one data stream `dflt`; clock frequency is 1 MHz
# (microseconds). barectf automatically adds a timestamp to every record.
#
# Event record types are grouped by semantics so that the CTF metadata is
# self-describing for babeltrace2 / Trace Compass.
trace:
  type:
    native-byte-order: le
    $field-type-aliases:
      uint8:
        class: uint
        size: 8
        alignment: 8
      uint16:
        class: uint
        size: 16
        alignment: 8
      uint32:
        class: uint
        size: 32
        alignment: 8
    clock-types:
      mono:
        frequency: 1000000
        origin-is-unix-epoch: false
    data-stream-types:
      dflt:
        $default-clock-type-name: mono
        event-record-types:
          # prev/next/cur_task are low 32 bits of task object pointers
          sched_switch:
            payload-field-type:
              class: struct
              members:
                - prev: uint32
                - next: uint32
                - cur_task: uint32
          # task state transition: ready / block / wake / timeout / create
          task_state:
            payload-field-type:
              class: struct
              members:
                - task: uint32
                - state: uint32
                - reason: uint32
          # kernel object operations: sem / queue / event / timer
          object_op:
            payload-field-type:
              class: struct
              members:
                - obj: uint32
                - op: uint16
                - value: uint32
          # tick and time slice
          tick:
            payload-field-type:
              class: struct
              members:
                - tick: uint32
                - delta: uint32
          # interrupt events: enter / exit / preempt request
          isr_event:
            payload-field-type:
              class: struct
              members:
                - isr: uint32
                - kind: uint32
                - arg: uint32
          # crash / assert / stack overflow
          crash:
            payload-field-type:
              class: struct
              members:
                - reason: uint32
                - code: uint32
                - task: uint32
          # fallback for unclassified events
          generic:
            payload-field-type:
              class: struct
              members:
                - id: uint16
                - task: uint32
                - value: uint32
                - arg: uint32
